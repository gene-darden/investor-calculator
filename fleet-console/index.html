<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Darden Fleet Console</title>
<link rel="manifest" href="manifest.json">
<style>
  :root { --navy:#1B2A4A; --navy2:#22345C; --gold:#D8973C; --cream:#F8F4ED; --ink:#2b2b2b; --ok:#3d9a5f; --hot:#c0392b; --warm:#d68910; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system, "Segoe UI", Arial, sans-serif; background:var(--navy); color:var(--cream); padding-bottom:40px; }
  header { padding:22px 18px 14px; }
  header h1 { font-size:20px; letter-spacing:.06em; }
  header h1 span { color:var(--gold); }
  .updated { font-size:11px; opacity:.65; margin-top:3px; }
  .headline { background:var(--gold); color:var(--navy); font-weight:700; font-size:14px; padding:10px 18px; }
  section { margin:14px 12px 0; background:var(--navy2); border-radius:14px; overflow:hidden; }
  .sec-h { display:flex; justify-content:space-between; align-items:center; padding:12px 14px 8px; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:700; }
  .badge { font-size:11px; padding:2px 10px; border-radius:20px; font-weight:700; letter-spacing:.02em; text-transform:none; }
  .b-ok { background:var(--ok); color:#fff; } .b-alert { background:var(--hot); color:#fff; }
  ul.plain { list-style:none; padding:0 14px 12px; }
  ul.plain li { font-size:13px; padding:5px 0; opacity:.9; border-top:1px solid rgba(255,255,255,.06); }
  ul.plain li:first-child { border-top:none; }
  .row { display:flex; gap:10px; padding:9px 14px; border-top:1px solid rgba(255,255,255,.07); align-items:baseline; }
  .row:first-of-type { border-top:none; }
  .dot { width:9px; height:9px; border-radius:50%; flex:none; position:relative; top:0px; }
  .hot .dot{ background:var(--hot);} .warm .dot{ background:var(--warm);} .cool .dot{ background:#7f8c8d;}
  .row .who { font-weight:700; font-size:14px; flex:none; }
  .row .why { font-size:12.5px; opacity:.75; }
  .stats { display:flex; text-align:center; padding:6px 8px 16px; }
  .stat { flex:1; }
  .stat .n { font-size:30px; font-weight:800; color:var(--gold); }
  .stat .l { font-size:10px; letter-spacing:.08em; text-transform:uppercase; opacity:.7; margin-top:2px; }
  .bar-wrap { margin:0 16px 16px; background:rgba(255,255,255,.12); height:10px; border-radius:6px; overflow:hidden; }
  .bar { height:100%; background:linear-gradient(90deg, var(--gold), #f0b96a); border-radius:6px; }
  .listing { padding:9px 14px; border-top:1px solid rgba(255,255,255,.07); }
  .listing:first-of-type{ border-top:none; }
  .l-top { display:flex; justify-content:space-between; font-size:13.5px; font-weight:700; }
  .l-status { font-size:11px; color:var(--gold); }
  .l-note { font-size:12px; opacity:.72; margin-top:2px; }
  footer { text-align:center; font-size:10px; opacity:.45; margin-top:26px; }
  .err { padding:30px; text-align:center; opacity:.8; }
</style>
</head>
<body>
<header>
  <h1>🏁 DARDEN <span>FLEET CONSOLE</span></h1>
  <div class="updated" id="updated">loading…</div>
</header>
<div class="headline" id="headline"></div>
<div id="app"><div class="err">Loading fleet data…</div></div>
<footer>The Darden Group OS · decision support · full detail lives in Todoist/Gmail</footer>
<script>
fetch('fleet-data.json?t=' + Date.now()).then(r => r.json()).then(d => {
  document.getElementById('updated').textContent = 'Updated ' + d.updated;
  document.getElementById('headline').textContent = d.headline || '';
  const hb = d.heartbeat || {};
  const hbBadge = hb.status === 'ok' ? '<span class="badge b-ok">ALL SYSTEMS GO</span>' : '<span class="badge b-alert">NEEDS EYES</span>';
  const money = d.money || {};
  const moneyBadge = money.status === 'clear' ? '<span class="badge b-ok">CLEAR</span>' : '<span class="badge b-alert">ALERT</span>';
  const pct = d.pipeline ? Math.min(100, Math.round(d.pipeline.closedYTD / d.pipeline.goal * 100)) : 0;
  document.getElementById('app').innerHTML = `
    <section>
      <div class="sec-h">⚙️ Fleet Heartbeat ${hbBadge}</div>
      <ul class="plain">${(hb.notes||[]).map(n=>`<li>${n}</li>`).join('')}</ul>
    </section>
    <section>
      <div class="sec-h">📞 Today's Call Block</div>
      ${(d.callBlock||[]).map(c=>`<div class="row ${c.heat||'cool'}"><span class="dot"></span><span class="who">${c.who}</span><span class="why">${c.why}</span></div>`).join('')}
    </section>
    <section>
      <div class="sec-h">🏠 Listings</div>
      ${(d.listings||[]).map(l=>`<div class="listing"><div class="l-top"><span>${l.addr}</span><span class="l-status">${l.status}</span></div><div class="l-note">${l.client} · ${l.note}</div></div>`).join('')}
    </section>
    <section>
      <div class="sec-h">📊 Pipeline · Goal ${d.pipeline.goal} (team ${d.pipeline.teamGoal})</div>
      <div class="stats">
        <div class="stat"><div class="n">${d.pipeline.closedYTD}</div><div class="l">Closed YTD</div></div>
        <div class="stat"><div class="n">${d.pipeline.paceProjection}</div><div class="l">Pace Projects</div></div>
        <div class="stat"><div class="n">${d.isa.openCallTasks}</div><div class="l">Open Calls</div></div>
      </div>
      <div class="bar-wrap"><div class="bar" style="width:${pct}%"></div></div>
    </section>
    <section>
      <div class="sec-h">💰 Money ${moneyBadge}</div>
      <ul class="plain"><li>${money.note||''}</li></ul>
    </section>
    <section>
      <div class="sec-h">🔧 Next Builds</div>
      <ul class="plain">${(d.builds||[]).map(b=>`<li>${b}</li>`).join('')}</ul>
    </section>`;
}).catch(() => {
  document.getElementById('app').innerHTML = '<div class="err">Could not load fleet-data.json — check the last refresh run.</div>';
});
</script>
</body>
</html>
