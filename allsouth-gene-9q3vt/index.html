<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ASA — Gene's Console</title>
<style>
  :root { --navy:#1B2A4A; --navy2:#22345C; --navy3:#2A3F6E; --gold:#D8973C; --goldsoft:#F0C987; --cream:#F8F4ED; --hot:#c0392b; --warm:#d68910; --ok:#3d9a5f; --blue:#3b7dd8; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system, "Segoe UI", Arial, sans-serif; background:var(--navy); color:var(--cream); padding-bottom:50px; }
  header { padding:calc(env(safe-area-inset-top) + 18px) 18px 10px; }
  header h1 { font-size:18px; letter-spacing:.05em; }
  header h1 span { color:var(--gold); }
  .sub { font-size:11px; opacity:.65; margin-top:3px; }
  .statbar { display:flex; text-align:center; padding:14px 8px 4px; }
  .statbar div { flex:1; }
  .statbar .n { font-size:24px; font-weight:800; color:var(--gold); }
  .statbar .l { font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; opacity:.7; margin-top:2px; }
  section { margin:12px 12px 0; background:var(--navy2); border-radius:14px; overflow:hidden; }
  .sec-h { padding:12px 14px 8px; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:700; display:flex; align-items:center; gap:8px; }
  .count { background:rgba(216,151,60,.18); color:var(--gold); border-radius:20px; font-size:11px; padding:1px 9px; }
  .sig { display:flex; gap:10px; padding:9px 14px; border-top:1px solid rgba(255,255,255,.07); font-size:13px; align-items:baseline; }
  .sig:first-of-type { border-top:none; }
  .sig .v { flex:none; font-weight:800; font-size:12px; }
  .sig .when { flex:none; margin-left:auto; font-size:11px; opacity:.55; white-space:nowrap; }
  .v-pursue { color:#7fd4a1; } .v-watch { color:#f0c987; } .v-pass { color:#e08a7f; } .v-more-info { color:var(--goldsoft); }
  .row { display:flex; gap:8px; padding:9px 14px; border-top:1px solid rgba(255,255,255,.07); font-size:12.5px; align-items:baseline; }
  .row:first-of-type { border-top:none; }
  .row .addr { flex:1; font-weight:700; line-height:1.35; }
  .row .addr small { display:block; font-weight:400; opacity:.6; font-size:11px; }
  .row .price { flex:none; color:var(--goldsoft); font-weight:700; white-space:nowrap; }
  .row .dob { flex:none; width:52px; text-align:right; font-size:11px; opacity:.7; }
  .row .tv { flex:none; width:64px; text-align:right; font-size:11px; font-weight:800; }
  .empty { font-size:12px; opacity:.55; padding:8px 14px 12px; }
  footer { text-align:center; font-size:10px; opacity:.45; margin-top:24px; padding:0 20px; line-height:1.6; }
  .err { padding:30px; text-align:center; opacity:.8; }
  .legend { font-size:10.5px; opacity:.6; padding:4px 14px 12px; line-height:1.6; }
</style>
</head>
<body>
<header>
  <h1>🔒 ALLSOUTH — <span>GENE'S CONSOLE</span></h1>
  <div class="sub">Private view · Tyler's board activity + days-on-board · <a href="../allsouth-hub-7k4mz/" style="color:#F0C987;">open Tyler's board ↗</a></div>
  <div class="sub" id="updated">loading…</div>
</header>
<div id="app"><div class="err">Loading…</div></div>
<footer>Verdict taps stream in live via the signal pipe; this rollup refreshes on the morning/evening sweeps.<br>DOB = days on board since first sweep appearance.</footer>
<script>
Promise.all([
  fetch("../allsouth-hub-7k4mz/data.json?t=" + Date.now()).then(r => r.json()),
  fetch("gene-data.json?t=" + Date.now()).then(r => r.json()).catch(() => ({verdicts: []})),
  fetch("first_seen.json?t=" + Date.now()).then(r => r.json()).catch(() => ({}))
]).then(([board, gene, firstSeen]) => {
  document.getElementById("updated").textContent = "Board updated " + board.updated + " · verdict log " + (gene.updated || "—");
  const V = (gene.verdicts || []).slice().sort((a,b) => (b.ts||"").localeCompare(a.ts||""));
  const latest = {};
  for (const v of V) if (!(v.listingId in latest)) latest[v.listingId] = v.verdict;
  const counts = {pursue:0, watch:0, pass:0, "more-info":0};
  for (const v of V) if (v.verdict in counts) counts[v.verdict]++;
  const days = id => {
    const d = firstSeen[id]; if (!d) return "—";
    const n = Math.max(0, Math.round((Date.now() - new Date(d + "T12:00:00")) / 86400000));
    return n + "d";
  };
  const vLabel = v => v === "pursue" ? "🟢 GO" : v === "watch" ? "🟡 WATCH" : v === "pass" ? "🔴 PASS" : v === "more-info" ? "📩 INFO" : "·";
  const vCls = v => "v-" + (v || "none");
  const ago = ts => {
    if (!ts) return "";
    const m = Math.round((Date.now() - new Date(ts)) / 60000);
    return m < 60 ? m + "m ago" : m < 1440 ? Math.round(m/60) + "h ago" : Math.round(m/1440) + "d ago";
  };
  const prio = id => ({pursue:0, "more-info":1, watch:2, undefined:3, pass:4})[latest[id]] ?? 3;

  document.getElementById("app").innerHTML = `
    <div class="statbar">
      <div><div class="n">${counts.pursue}</div><div class="l">🟢 Pursue</div></div>
      <div><div class="n">${counts["more-info"]}</div><div class="l">📩 Info</div></div>
      <div><div class="n">${counts.watch}</div><div class="l">🟡 Watch</div></div>
      <div><div class="n">${counts.pass}</div><div class="l">🔴 Pass</div></div>
      <div><div class="n">${board.lanes.reduce((s,x) => s + x.listings.length, 0)}</div><div class="l">On Board</div></div>
    </div>
    <section>
      <div class="sec-h">📡 Tyler's Signal Feed <span class="count">${V.length}</span></div>
      ${V.slice(0, 30).map(v => `
        <div class="sig"><span class="v ${vCls(v.verdict)}">${vLabel(v.verdict)}</span><span>${v.address || v.listingId}</span><span class="when">${ago(v.ts)}</span></div>`).join("")
        || '<div class="empty">No taps yet — the feed lights up the moment Tyler touches a verdict button.</div>'}
    </section>
    ${board.lanes.map(ln => `
      <section>
        <div class="sec-h">${ln.emoji} ${ln.label} <span class="count">${ln.listings.length}</span></div>
        ${ln.listings.slice().sort((a,b) => prio(a.id) - prio(b.id)).map(l => `
          <div class="row">
            <span class="addr">${l.address}<small>${l.city}${l.badge === "RADAR" ? " · radar" : ""}</small></span>
            <span class="price">${l.price ? "$" + l.price.toLocaleString() : (l.leaseRate || "—")}</span>
            <span class="dob">${days(l.id)}</span>
            <span class="tv ${vCls(latest[l.id])}">${latest[l.id] ? vLabel(latest[l.id]) : "·"}</span>
          </div>`).join("")}
        <div class="legend">${(ln.note || "").split(".")[0]}.</div>
      </section>`).join("")}`;
}).catch(() => {
  document.getElementById("app").innerHTML = '<div class="err">Could not load console data — check the last deploy.</div>';
});
</script>
</body>
</html>
