<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Darden Showing Board</title>
<link rel="manifest" href="manifest.json">
<style>
  :root { --navy:#1B2A4A; --navy2:#22345C; --navy3:#2A3F6E; --gold:#D8973C; --cream:#F8F4ED; --hot:#c0392b; --warm:#d68910; --cold:#7f8c8d; --ok:#3d9a5f; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system, "Segoe UI", Arial, sans-serif; background:var(--navy); color:var(--cream); padding-bottom:44px; }
  header { padding:22px 18px 12px; display:flex; justify-content:space-between; align-items:flex-end; }
  header h1 { font-size:20px; letter-spacing:.06em; }
  header h1 span { color:var(--gold); }
  .updated { font-size:11px; opacity:.65; }
  .headline { background:var(--gold); color:var(--navy); font-weight:700; font-size:14px; line-height:1.35; padding:11px 18px; }
  .statbar { display:flex; text-align:center; padding:12px 8px 4px; }
  .statbar div { flex:1; }
  .statbar .n { font-size:26px; font-weight:800; color:var(--gold); }
  .statbar .l { font-size:10px; letter-spacing:.08em; text-transform:uppercase; opacity:.7; }
  section { margin:14px 12px 0; background:var(--navy2); border-radius:14px; overflow:hidden; }
  .sec-h { padding:12px 14px 8px; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:700; display:flex; align-items:center; gap:8px; }
  .count { background:rgba(216,151,60,.18); color:var(--gold); border-radius:20px; font-size:11px; padding:1px 9px; }
  .sig { margin:0 10px 10px; background:var(--navy3); border-left:4px solid var(--gold); border-radius:10px; padding:11px 12px; }
  .sig .s-top { display:flex; justify-content:space-between; align-items:baseline; font-weight:800; font-size:14px; }
  .sig .s-date { font-size:11px; opacity:.6; font-weight:400; flex:none; margin-left:8px; }
  .sig .s-body { font-size:12.5px; opacity:.88; margin-top:5px; line-height:1.45; }
  .sig .s-act { font-size:12.5px; margin-top:7px; padding-top:7px; border-top:1px dashed rgba(255,255,255,.15); color:#F0C987; line-height:1.4; }
  .sig .s-act::before { content:"→ "; font-weight:800; }
  .new { background:var(--hot); color:#fff; font-size:9.5px; font-weight:800; letter-spacing:.06em; padding:2px 7px; border-radius:10px; vertical-align:2px; margin-left:6px; }
  .up { display:flex; gap:10px; padding:10px 14px; border-top:1px solid rgba(255,255,255,.07); font-size:13px; align-items:baseline; }
  .up:first-of-type { border-top:none; }
  .up .u-when { color:var(--gold); font-weight:700; font-size:12px; flex:none; width:118px; line-height:1.35; }
  .up .u-what b { font-weight:700; }
  .up .u-note { display:block; font-size:11.5px; opacity:.65; margin-top:1px; }
  .card { border-top:1px solid rgba(255,255,255,.07); }
  .card:first-of-type { border-top:none; }
  .c-head { display:flex; justify-content:space-between; align-items:center; padding:11px 14px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .c-head .addr { font-size:14px; font-weight:800; }
  .c-head .meta { font-size:11px; opacity:.65; margin-top:2px; }
  .c-right { text-align:right; flex:none; margin-left:10px; }
  .pill { display:inline-block; font-size:10px; font-weight:800; letter-spacing:.04em; border-radius:10px; padding:2px 8px; }
  .p-active { background:var(--ok); color:#fff; } .p-cont { background:var(--warm); color:#fff; } .p-soon { background:var(--gold); color:var(--navy); }
  .c-right .sh { font-size:11px; opacity:.75; margin-top:4px; }
  .c-body { display:none; padding:0 14px 12px; }
  .card.open .c-body { display:block; }
  .fb { display:flex; gap:9px; padding:7px 0; border-top:1px solid rgba(255,255,255,.06); font-size:12.5px; line-height:1.4; }
  .fb .dot { width:9px; height:9px; border-radius:50%; flex:none; margin-top:5px; }
  .t-hot .dot { background:var(--hot); box-shadow:0 0 6px var(--hot); } .t-warm .dot { background:var(--warm); } .t-cold .dot { background:var(--cold); }
  .fb .f-agent { font-weight:700; }
  .fb .f-date { opacity:.55; font-size:11px; }
  .gap { font-size:12px; color:#F0C987; padding:6px 0 0; }
  .gap::before { content:"⏳ "; }
  .lnote { font-size:12px; opacity:.7; padding:7px 0 0; font-style:italic; }
  .empty { font-size:12px; opacity:.55; padding:6px 0; }
  .owe { padding:9px 14px; border-top:1px solid rgba(255,255,255,.07); font-size:13px; display:flex; justify-content:space-between; align-items:baseline; }
  .owe:first-of-type { border-top:none; }
  .owe .o-when { font-size:11px; opacity:.65; flex:none; margin-left:10px; }
  footer { text-align:center; font-size:10px; opacity:.45; margin-top:26px; padding:0 20px; line-height:1.6; }
  .err { padding:30px; text-align:center; opacity:.8; }
</style>
</head>
<body>
<header>
  <h1>🚪 DARDEN <span>SHOWING BOARD</span></h1>
  <div class="updated" id="updated">loading…</div>
</header>
<div class="headline" id="headline"></div>
<div id="app"><div class="err">Loading showing data…</div></div>
<footer>The Darden Group OS · showings &amp; feedback, last 14 days · agent contact details live in the Master Call Sheet email</footer>
<script>
fetch('showings-data.json?t=' + Date.now()).then(r => r.json()).then(d => {
  document.getElementById('updated').textContent = 'Updated ' + d.updated;
  document.getElementById('headline').textContent = d.headline || '';
  const st = d.stats || {};
  const pillCls = s => s === 'ACTIVE' ? 'p-active' : (s === 'COMING SOON' ? 'p-soon' : 'p-cont');
  document.getElementById('app').innerHTML = `
    <div class="statbar">
      <div><div class="n">${st.showings14d ?? '–'}</div><div class="l">Showings 14d</div></div>
      <div><div class="n">${st.feedback14d ?? '–'}</div><div class="l">Feedback In</div></div>
      <div><div class="n">${st.gaps ?? '–'}</div><div class="l">Gaps Open</div></div>
    </div>
    <section>
      <div class="sec-h">🔥 Solid Hits <span class="count">${(d.hotSignals||[]).length}</span></div>
      ${(d.hotSignals||[]).map(s => `
        <div class="sig">
          <div class="s-top"><span>${s.addr}${s.isNew ? '<span class="new">NEW</span>' : ''}</span><span class="s-date">${s.date}</span></div>
          <div class="s-body">${s.signal}</div>
          <div class="s-act">${s.action}</div>
        </div>`).join('') || '<div class="empty" style="padding:0 14px 12px">No hot signals right now.</div>'}
    </section>
    <section>
      <div class="sec-h">📅 Upcoming</div>
      ${(d.upcoming||[]).map(u => `
        <div class="up"><span class="u-when">${u.when}</span><span class="u-what"><b>${u.addr}</b> · ${u.type}<span class="u-note">${u.note||''}</span></span></div>`).join('') || '<div class="empty" style="padding:0 14px 12px">Nothing on the books.</div>'}
    </section>
    <section>
      <div class="sec-h">🏠 Listings <span class="count">${(d.listings||[]).length}</span></div>
      ${(d.listings||[]).map((l,i) => `
        <div class="card${i===0?' open':''}">
          <div class="c-head" onclick="this.parentElement.classList.toggle('open')">
            <div><div class="addr">${l.addr}</div><div class="meta">${l.city} · ${l.price} · ${l.client}</div></div>
            <div class="c-right"><span class="pill ${pillCls(l.status)}">${l.status}</span><div class="sh">${l.showings14d} showing${l.showings14d===1?'':'s'}</div></div>
          </div>
          <div class="c-body">
            ${(l.feedback||[]).map(f => `<div class="fb t-${f.tone}"><span class="dot"></span><span><span class="f-agent">${f.agent}</span> <span class="f-date">· ${f.date}</span><br>${f.note}</span></div>`).join('') || '<div class="empty">No feedback in this window.</div>'}
            ${(l.gaps||[]).map(g => `<div class="gap">${g}</div>`).join('')}
            ${l.note ? `<div class="lnote">${l.note}</div>` : ''}
          </div>
        </div>`).join('')}
    </section>
    <section>
      <div class="sec-h">✍️ You Owe Feedback <span class="count">${(d.oweFeedback||[]).length}</span></div>
      ${(d.oweFeedback||[]).map(o => `<div class="owe"><span><b>${o.addr}</b> · ${o.price}</span><span class="o-when">${o.when}</span></div>`).join('') || '<div class="empty" style="padding:0 14px 12px">All caught up. 👊</div>'}
    </section>`;
}).catch(() => {
  document.getElementById('app').innerHTML = '<div class="err">Could not load showings-data.json — check the last deploy.</div>';
});
</script>
</body>
</html>
